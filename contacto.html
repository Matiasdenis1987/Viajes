<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto | Valle Sagrado</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Diseño.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark site-nav">
      <div class="container">
        <a class="navbar-brand" href="index.html">Valle Sagrado</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menú"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="nosotros.html">Sobre el lugar</a></li>
            <li class="nav-item"><a class="nav-link" href="experiencias.html">Qué visitar</a></li>
            <li class="nav-item"><a class="nav-link" href="galeria.html">Fotos</a></li>
            <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <section class="page-hero contact-hero">
      <div class="container">
        <p class="eyebrow">CONTACTO</p>
        <h1>Dejá tu mensaje</h1>
        <p>¿Qué lugar te gustaría conocer?</p>
      </div>
    </section>
    <section class="section-pad">
      <div class="container">
        <div class="row g-4">
          <div class="col-md-5">
            <h2 class="section-title">Tu opinión</h2>
            <p class="text-muted-custom">Dejame tu opinión sobre el Valle Sagrado.</p>
            <div class="image-frame mt-4">
              <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/6/6f/Chinchero%2C_Angled_Agricultural_Terraces.jpg/1280px-Chinchero%2C_Angled_Agricultural_Terraces.jpg" alt="Terrazas agrícolas de Chinchero">
            </div>
          </div>
          <div class="col-md-7">
            <form class="contact-form" id="contact-form">
              <div class="mb-3"><label class="form-label" for="name">Nombre</label><input class="form-control" id="name" type="text" placeholder="Escribí tu nombre" required></div>
              <div class="mb-3"><label class="form-label" for="email">Correo</label><input class="form-control" id="email" type="email" placeholder="nombre@ejemplo.com" required></div>
              <div class="mb-3"><label class="form-label" for="message">Mensaje</label><textarea class="form-control" id="message" rows="5" placeholder="Escribí tu mensaje" required></textarea></div>
              <button class="btn btn-coral" type="submit">Enviar</button>
              <p class="form-feedback mt-3 mb-0" id="form-feedback" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
